# config.toml

# Stage1 manual internet verification:
# - peers.ip can be private LAN IP OR global IPv4.
# - for internet test, receiver side needs router UDP port-forward + Windows Firewall allow rule.
# - no NAT traversal/STUN/TURN/hole punching in this stage.
# Example global IP: "203.0.113.12"

myport = 49154
machineID = 104

[[peers]]
ip = "127.0.0.1"
port = 49152

[[peers]]
ip = "127.0.0.1"
port = 49153
